services:
  studio:
    build: .
    image: petrirl-studio
    container_name: petrirl-studio
    ports:
      - "${PETRIRL_PORT:-5000}:5000"   # host port: set PETRIRL_PORT to change it
    volumes:
      # a folder of the server: instances, agents, runs, solutions, visitor count. It survives every rebuild and
      # keeps the container small. Default ./data (the same folder run.py uses); set PETRIRL_DATA_PATH to move it.
      - ${PETRIRL_DATA_PATH:-./data}:/data
    environment:
      SECRET_KEY: ${PETRIRL_SECRET_KEY:-change-me}
      PETRIRL_PUBLIC: ${PETRIRL_PUBLIC:-0}  # 1 = public demo: no agent uploads, no deleting or changing
      PETRIRL_SITE_URL: ${PETRIRL_SITE_URL:-https://petrirl.de}          # canonical links and sitemap
      PETRIRL_OPERATOR_NAME: ${PETRIRL_OPERATOR_NAME:-Sofiene Lassoued}   # privacy page: who runs the site
      PETRIRL_OPERATOR_ADDRESS: ${PETRIRL_OPERATOR_ADDRESS:-}
      PETRIRL_OPERATOR_EMAIL: ${PETRIRL_OPERATOR_EMAIL:-}
      PETRIRL_COMPUTE_SLOTS: 1        # jobs (solve or train) computing at the same time
      PETRIRL_QUEUE_MAX: 20           # jobs allowed to wait in line, more are refused
      OMP_NUM_THREADS: 1              # PyTorch and NumPy use one thread
      MKL_NUM_THREADS: 1
    cpus: 1.0                         # at most one CPU core
    mem_limit: 2g
    restart: unless-stopped
    logging:                          # keep the container logs small
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
